#tavolo::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 44%, transparent 30%, rgba(46,28,7,.46) 100%);
}
.wrap{ position:relative; z-index:1; }
.wrap{ height:100%; display:flex; flex-direction:column; align-items:center;
       padding:clamp(8px,1.8vh,18px) 14px; }
.consegna{
  max-width:720px; text-align:center; flex-shrink:0;
  background:rgba(255,252,246,.95); border:1px solid rgba(80,60,30,.3);
  border-radius:10px; padding:clamp(9px,1.5vh,15px) 20px;
  box-shadow:0 4px 18px rgba(50,32,10,.3);
}
.consegna h1{ font-size:clamp(.95rem,2.2vh,1.16rem); font-weight:600; margin-bottom:5px; }
.consegna p{ font-size:clamp(.8rem,1.8vh,.94rem); line-height:1.5; color:#4a4238; }
.consegna strong{ color:#2b2620; }
.scena{ flex:1; min-height:0; width:100%; display:flex;
        align-items:center; justify-content:center; margin:clamp(4px,1.2vh,12px) 0; }
svg#figura{ height:100%; max-height:100%; width:auto; cursor:crosshair;
            touch-action:manipulation; }
svg#figura.piena{ cursor:not-allowed; }
.barra{
  flex-shrink:0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  justify-content:center; background:rgba(255,252,246,.96);
  border:1px solid rgba(80,60,30,.3); border-radius:10px;
  padding:10px 16px; box-shadow:0 4px 18px rgba(50,32,10,.3);
}
.contatore{ font-size:clamp(.85rem,2vh,1rem); font-variant-numeric:tabular-nums; }
.contatore b{ font-size:1.3em; }
.btn{ font:inherit; font-size:clamp(.8rem,1.9vh,.95rem); border-radius:8px;
      padding:9px 18px; cursor:pointer; border:1px solid transparent;
      transition:filter .15s, transform .06s; }
.btn:active:not(:disabled){ transform:translateY(1px); }
.btn-sec{ background:#efe7d8; border-color:rgba(80,60,30,.35); color:#4a4238; }
.btn-sec:disabled{ opacity:.4; cursor:default; }
.btn-pri{ background:#3f6b46; color:#fff; font-weight:600;
          box-shadow:0 2px 8px rgba(40,70,45,.35); }
.btn:hover:not(:disabled){ filter:brightness(1.06); }
.fine{ position:fixed; inset:0; z-index:50; display:none; align-items:center;
       justify-content:center; background:rgba(35,28,18,.82); }
.fine.on{ display:flex; }
.fine .box{ background:#fffdf7; border-radius:14px; padding:34px 40px; text-align:center;
            max-width:460px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
.fine h2{ font-size:1.2rem; margin-bottom:10px; }
.fine p{ color:#5a5145; line-height:1.55; font-size:.95rem; }
</style>

function zonaDi(x, y){
  if(!zctx) { return null; }
  var xi = Math.round(x), yi = Math.round(y);
  if(xi < 0 || yi < 0 || xi >= VB.w || yi >= VB.h) { return null; }
  var d = zctx.getImageData(xi, yi, 1, 1).data;
  return ZONE[d[0] + "," + d[1] + "," + d[2]] || null;
}

var spilli = [];
var avvio  = new Date().getTime();
var chiuso = false;

function puntoSvg(evt){
  var r = svg.getBoundingClientRect();
  var scala = Math.min(r.width / VB.w, r.height / VB.h);
  var offX = (r.width  - VB.w * scala) / 2;
  var offY = (r.height - VB.h * scala) / 2;
  return { x: (evt.clientX - r.left - offX)/scala,
           y: (evt.clientY - r.top  - offY)/scala };
}

function piantaSpillo(x, y){
  var img = document.createElementNS(NS, "image");
  var src = SPILLI[Math.floor(Math.random()*SPILLI.length)];
  img.setAttributeNS(XL, "href", src);
  img.setAttribute("href", src);
  img.setAttribute("width", SPRITE);
  img.setAttribute("height", SPRITE);
  img.setAttribute("x", x - TIPX);
  img.setAttribute("y", y - TIPY);
  var a = (Math.random()*46 - 23).toFixed(1);
  img.setAttribute("transform", "rotate(" + a + " " + x.toFixed(1) + " " + y.toFixed(1) + ")");
  img.setAttribute("style", "pointer-events:none");
  strato.appendChild(img);
  return img;
}

svg.addEventListener("click", function(evt){
  if(chiuso || spilli.length >= P.max) { return; }
  var p = puntoSvg(evt);
  var z = zonaDi(p.x, p.y);
  if(!z) { return; }                       /* clic fuori dalla figura */
  var nodo = piantaSpillo(p.x, p.y);
  spilli.push({
    xPerc: +((p.x / VB.w)*100).toFixed(2),
    yPerc: +((p.y / VB.h)*100).toFixed(2),
    zona: z,
    ms: new Date().getTime() - avvio,
    nodo: nodo
  });
  aggiorna();
});

btnUndo.addEventListener("click", function(){
  if(chiuso || !spilli.length) { return; }
  var u = spilli.pop();
  if(u.nodo && u.nodo.parentNode){ u.nodo.parentNode.removeChild(u.nodo); }
  aggiorna();
});

function aggiorna(){
  elConta.textContent = spilli.length;
  btnUndo.disabled = spilli.length === 0;
  if(spilli.length >= P.max){ svg.classList.add("piena"); }
  else { svg.classList.remove("piena"); }
}

btnFatto.addEventListener("click", function(){
  if(chiuso) { return; }
  chiuso = true;
  btnFatto.disabled = true;
  btnUndo.disabled = true;

  var perZona = {};
  spilli.forEach(function(s){ perZona[s.zona] = (perZona[s.zona] || 0) + 1; });

  var dati = {
    source: "figura",
    pid: P.pid,
    target: P.target,
    spilli: spilli.length,
    per_zona: perZona,
    posizioni: spilli.map(function(s){ return { x:s.xPerc, y:s.yPerc, zona:s.zona }; }),
    tempi: spilli.map(function(s){ return s.ms; }),
    ms_totale: new Date().getTime() - avvio
  };

  try{ parent.postMessage(dati, "*"); }catch(e){}
  document.getElementById("schermataFine").classList.add("on");
});
</script>
