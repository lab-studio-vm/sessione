<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessione</title>
<style>
/* ============================================================
   COMPITO DELLA FIGURA
   Misura comportamentale di aggressivita' diretta a un bersaglio.
   Da 0 a 51 spilli.

   Figura androgina, identica per tutti i bersagli. Le zone del
   corpo sono ricavate analizzando la sagoma riga per riga:
   seguono il contorno reale della foto.

   Dati nel formato della versione Qualtrics del relatore:
   posizioni in PERCENTUALE (PinPositions), tempi in ms
   (PinClickTimes), piu' la zona del corpo.

   PARAMETRI URL: ?pid=  ?target=  ?sesso=f|m  ?max=
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{ height:100%; overflow:hidden; background:#fff; color:#24262a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
.wrap{ height:100%; display:flex; flex-direction:column; align-items:center;
       padding:clamp(10px,2vh,22px) 16px; }
.consegna{ max-width:760px; text-align:center; flex-shrink:0; background:#fff;
  border:1px solid #dcdcdc; border-radius:10px; padding:clamp(10px,1.6vh,16px) 22px;
  box-shadow:0 2px 10px rgba(30,30,30,.07); }
.consegna p{ font-size:clamp(.82rem,1.85vh,.98rem); line-height:1.55; color:#3c3f44; }
.consegna strong{ color:#1d1f22; }
.scena{ flex:1; min-height:0; width:100%; display:flex; align-items:center;
        justify-content:center; margin:clamp(6px,1.4vh,14px) 0; }
svg#figura{ height:100%; max-height:100%; width:auto; cursor:crosshair; touch-action:manipulation; }
svg#figura.piena{ cursor:not-allowed; }
.barra{ flex-shrink:0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  justify-content:center; background:#fafafa; border:1px solid #dcdcdc;
  border-radius:10px; padding:10px 16px; box-shadow:0 2px 10px rgba(30,30,30,.07); }
.btn{ font:inherit; font-size:clamp(.82rem,1.9vh,.96rem); border-radius:8px;
      padding:9px 20px; cursor:pointer; border:1px solid transparent;
      transition:filter .15s, transform .06s; }
.btn:active:not(:disabled){ transform:translateY(1px); }
.btn-sec{ background:#eeece8; border-color:#cdcbc6; color:#4a4d52; }
.btn-sec:disabled{ opacity:.4; cursor:default; }
.btn-pri{ background:#3f6b46; color:#fff; font-weight:600; }
.btn:hover:not(:disabled){ filter:brightness(1.06); }
.fine{ position:fixed; inset:0; z-index:50; display:none; align-items:center;
       justify-content:center; background:rgba(30,30,32,.78); }
.fine.on{ display:flex; }
.fine .box{ background:#fff; border-radius:14px; padding:34px 40px; text-align:center;
            max-width:460px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
.fine h2{ font-size:1.18rem; margin-bottom:10px; }
.fine p{ color:#55585d; line-height:1.55; font-size:.95rem; }
</style>
</head>
<body>

<div class="wrap">
  <div class="consegna"><p id="istruzioni"></p></div>
  <div class="scena">
    <svg id="figura" xmlns="http://www.w3.org/2000/svg" aria-label="Figura">
      <image id="corpo" x="0" y="0"/>
      <g id="spilli"></g>
    </svg>
  </div>
  <div class="barra">
    <button class="btn btn-sec" id="annulla" disabled>Togli l'ultimo</button>
    <button class="btn btn-pri" id="fatto">Ho finito</button>
  </div>
</div>

<div class="fine" id="schermataFine">
  <div class="box">
    <h2>Grazie.</h2>
    <p>Vai alla pagina successiva per proseguire con lo studio.</p>
  </div>
</div>

var SPRITE = 100, TIPX = 12, TIPY = 86;

var svg     = document.getElementById("figura");
var corpo   = document.getElementById("corpo");
var strato  = document.getElementById("spilli");
var btnUndo = document.getElementById("annulla");
var btnFatto= document.getElementById("fatto");

svg.setAttribute("viewBox", "0 0 " + VB.w + " " + VB.h);
corpo.setAttribute("width", VB.w);
corpo.setAttribute("height", VB.h);
corpo.setAttributeNS(XL, "href", F.img);
corpo.setAttribute("href", F.img);

var ZONE = {
  "255,0,0":"testa", "0,255,0":"torso",
  "0,0,255":"braccio sinistro", "255,255,0":"braccio destro",
  "255,0,255":"gamba sinistra", "0,255,255":"gamba destra"
};
var zctx = null;
(function(){
  var img = new Image();
  img.onload = function(){
    var c = document.createElement("canvas");
    c.width = VB.w; c.height = VB.h;
    zctx = c.getContext("2d", { willReadFrequently:true });
    zctx.drawImage(img, 0, 0, VB.w, VB.h);
  };
  img.src = F.zona;
})();

function zonaDi(x, y){
  if(!zctx) { return null; }
  var xi = Math.round(x), yi = Math.round(y);
  if(xi < 0 || yi < 0 || xi >= VB.w || yi >= VB.h) { return null; }
  var d = zctx.getImageData(xi, yi, 1, 1).data;
  return ZONE[d[0] + "," + d[1] + "," + d[2]] || null;
}

var spilli = [];
var avvio = new Date().getTime();
var chiuso = false;

function puntoSvg(evt){
  var r = svg.getBoundingClientRect();
  var s = Math.min(r.width/VB.w, r.height/VB.h);
  return { x: (evt.clientX - r.left - (r.width - VB.w*s)/2)/s,
           y: (evt.clientY - r.top  - (r.height - VB.h*s)/2)/s };
}

function piantaSpillo(x, y){
  var img = document.createElementNS(NS, "image");
  var src = SPILLI[Math.floor(Math.random()*SPILLI.length)];
  img.setAttributeNS(XL, "href", src);
  img.setAttribute("href", src);
  img.setAttribute("width", SPRITE);
  img.setAttribute("height", SPRITE);
  img.setAttribute("x", x - TIPX);
  img.setAttribute("y", y - TIPY);
  img.setAttribute("transform", "rotate(" + (Math.random()*46-23).toFixed(1) +
                   " " + x.toFixed(1) + " " + y.toFixed(1) + ")");
  img.setAttribute("style", "pointer-events:none");
  strato.appendChild(img);
  return img;
}

svg.addEventListener("click", function(evt){
  if(chiuso || spilli.length >= P.max) { return; }
  var p = puntoSvg(evt);
  var z = zonaDi(p.x, p.y);
  if(!z) { return; }
  var nodo = piantaSpillo(p.x, p.y);
  spilli.push({
    xPerc: +((p.x/VB.w)*100).toFixed(2),
    yPerc: +((p.y/VB.h)*100).toFixed(2),
    zona: z, ms: new Date().getTime() - avvio, nodo: nodo
  });
  aggiorna();
});

btnUndo.addEventListener("click", function(){
  if(chiuso || !spilli.length) { return; }
  var u = spilli.pop();
  if(u.nodo && u.nodo.parentNode){ u.nodo.parentNode.removeChild(u.nodo); }
  aggiorna();
});

function aggiorna(){
  btnUndo.disabled = spilli.length === 0;
  if(spilli.length >= P.max){ svg.classList.add("piena"); }
  else { svg.classList.remove("piena"); }
}

btnFatto.addEventListener("click", function(){
  if(chiuso) { return; }
  chiuso = true;
  btnFatto.disabled = true; btnUndo.disabled = true;
  var perZona = {};
  spilli.forEach(function(s){ perZona[s.zona] = (perZona[s.zona] || 0) + 1; });
  var dati = {
    source: "figura",
    pid: P.pid, target: P.target, sesso: P.sesso,
    spilli: spilli.length,
    per_zona: perZona,
    posizioni: spilli.map(function(s){ return { x:s.xPerc, y:s.yPerc, zona:s.zona }; }),
    tempi: spilli.map(function(s){ return s.ms; }),
    ms_totale: new Date().getTime() - avvio
  };
  try{ parent.postMessage(dati, "*"); }catch(e){}
  document.getElementById("schermataFine").classList.add("on");
});
</script>
</body>
</html>
