<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connessione alla sessione</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
    color: #fff;
  }
  #app {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .loading-content {
    text-align: center; color: #fff; padding: 0 20px;
    max-width: 540px;
  }
  .loading-content h2 {
    font-size: 26px; margin-bottom: 24px; color: #fff;
  }
  .loading-content p {
    color: #cbd5e1; font-size: 16px; line-height: 1.5;
  }
  .spinner {
    width: 64px; height: 64px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #60a5fa; border-radius: 50%;
    animation: spin 1s linear infinite; margin: 28px auto;
    transition: opacity 0.4s;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .connection-status {
    margin-top: 18px; font-size: 14px; color: #94a3b8;
    min-height: 20px;
  }
  .player-list {
    margin-top: 28px; display: flex; gap: 14px;
    justify-content: center; flex-wrap: wrap;
  }
  .player-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 18px; border-radius: 20px;
    font-size: 14px; color: #cbd5e1;
    transition: all 0.4s;
  }
  .player-chip.connected {
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.45);
    background: rgba(74, 222, 128, 0.08);
  }
  .player-chip .dot { display: inline-block; margin-left: 6px; }

  .final-message {
    display: none;
    margin-top: 24px;
    padding: 22px 28px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    font-size: 15px; color: #e2e8f0;
    line-height: 1.6;
  }
  .final-message.visible { display: block; }
  .final-message .check {
    display: block; font-size: 36px; color: #4ade80; margin-bottom: 8px;
  }
  .final-message strong { color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div class="loading-content">
    <h2 id="phase-title">Connessione agli altri giocatori</h2>
    <div class="spinner" id="spinner"></div>
    <p class="connection-status" id="conn-status">Ricerca di partecipanti online in corso...</p>
    <div class="player-list" id="player-list">
      <div class="player-chip connected" id="chip-self">Tu <span class="dot" style="color:#4ade80">●</span></div>
      <div class="player-chip" id="chip-a">In attesa...</div>
      <div class="player-chip" id="chip-b">In attesa...</div>
    </div>

    <div class="final-message" id="final-message">
      <span class="check">✓</span>
      <strong>Ricerca completata.</strong><br>
      Torna alla schermata iniziale per proseguire con la sessione.
    </div>
  </div>
</div>

<script>
/* =========================================================================
   PAIRING — schermata di pairing fittizia, ~20 secondi.
   I "compagni" trovati sono fake: nomi pescati casualmente da un pool.
   ========================================================================= */

// Nickname fissi degli "altri giocatori" (coerenti con i nomi sopra
// i personaggi nelle pagine di gioco)
function pickTwoNicks() {
  return ['riccardo_s', 'federica.99'];
}

function setStatus(text) {
  document.getElementById('conn-status').textContent = text;
}

function connectChip(id, label) {
  const chip = document.getElementById(id);
  chip.textContent = label;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.color = '#4ade80';
  dot.textContent = ' ●';
  chip.appendChild(dot);
  chip.classList.add('connected');
}

document.addEventListener('DOMContentLoaded', () => {
  const [nickA, nickB] = pickTwoNicks();

  // Sequenza di stati su circa 20 secondi
  // 0s     → "Ricerca di partecipanti online in corso..."
  setTimeout(() => setStatus('Verifica della connessione...'),                3000);
  setTimeout(() => setStatus('Ricerca di un primo compagno disponibile...'),  6000);
  setTimeout(() => {
    connectChip('chip-a', nickA);
    setStatus('Un giocatore si è collegato. Ricerca del secondo compagno...');
  }, 9500);
  setTimeout(() => setStatus('Sincronizzazione in corso...'),                13000);
  setTimeout(() => {
    connectChip('chip-b', nickB);
    setStatus('Tutti i giocatori sono connessi. Preparazione ambiente...');
  }, 16500);
  setTimeout(() => setStatus('Sessione pronta.'),                            19000);

  // A 20s: schermata finale, fine flusso
  setTimeout(() => {
    document.getElementById('phase-title').textContent = 'Sessione pronta';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('conn-status').style.display = 'none';
    document.getElementById('final-message').classList.add('visible');
  }, 20000);
});
</script>
</body>
</html>

<script>
/* --- nomi dei giocatori simulati, passati dal questionario (?p1= e ?p2=) ---
   Aggiunto settembre 2026. Se i parametri non ci sono, non cambia nulla:
   restano i nomi predefiniti. Serve a evitare che tutti i partecipanti
   incontrino sempre la stessa coppia di giocatori. */
(function () {
var DEF_A = "riccardo_s", DEF_B = "federica.99";
var a = DEF_A, b = DEF_B;
try {
var q = new URLSearchParams(location.search);
if (q.get("p1")) { a = q.get("p1"); }
if (q.get("p2")) { b = q.get("p2"); }
} catch (e) {}
if (a === DEF_A && b === DEF_B) { return; }
if (typeof NICK !== "undefined" && NICK) { NICK.A = a; NICK.B = b; }
function sost(n) {
if (n.nodeType === 3) {
var t = n.nodeValue;
if (t.indexOf(DEF_A) > -1 || t.indexOf(DEF_B) > -1) {
n.nodeValue = t.split(DEF_A).join(a).split(DEF_B).join(b);
}
return;
}
if (n.nodeType !== 1 || n.tagName === "SCRIPT" || n.tagName === "STYLE") { return; }
for (var i = 0; i < n.childNodes.length; i++) { sost(n.childNodes[i]); }
}
function passa() { if (document.body) { sost(document.body); } }
function avvia() {
passa();
var attesa = false;
new MutationObserver(function () {
if (attesa) { return; }
attesa = true;
setTimeout(function () { attesa = false; passa(); }, 60);
}).observe(document.body, { childList: true, subtree: true, characterData: true });
}
if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", avvia); } else { avvia(); }
})();
</script>

<script>
/* --- testo finale: il partecipante prosegue dal questionario, non "torna" ---
   Aggiunto settembre 2026, su indicazione del relatore. */
(function () {
  function sistema() {
    var nodi = document.querySelectorAll("*");
    for (var i = 0; i < nodi.length; i++) {
      var e = nodi[i];
      if (e.children.length === 0 && e.textContent.indexOf("Torna alla schermata iniziale") > -1) {
        e.textContent = e.textContent.replace("Torna alla schermata iniziale",
                                              "Vai alla pagina successiva");
      }
    }
  }
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", sistema); } else { sistema(); }
  setInterval(sistema, 300);
})();
</script>
